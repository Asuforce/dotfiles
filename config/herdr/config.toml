onboarding = false
# herdr configuration
#
# Hand-written entries stay limited to intentional deviations from
# `herdr --default-config`, so that version upgrades do not turn this file into
# a full-file diff. herdr also writes to this file itself when settings change
# through its UI (`onboarding`, theme, ...), so machine-written keys showing up
# in the diff are expected. Print the defaults with `herdr --default-config`;
# apply edits with `herdr server reload-config`.

[theme]
# herdr's own UI chrome (sidebar, tab bar, pane borders). Pane contents are
# still coloured by the host terminal's palette, not by this.
name = "one-dark"

auto_switch = false
[keys]
# herdr owns pane/tab/workspace management, so it takes the prefix that
# wezterm's leader key used to hold. wezterm no longer binds ctrl+g.
prefix = "ctrl+g"

[ui]
tab_bar_right = [
  { type = "hostname" },
  { type = "datetime", format = "%Y-%m-%d(%a) %H:%M" },
]
window_title = "{hostname}: {workspace}"

[experimental]
# Temporarily switch the input source to ASCII while prefix mode is active, so
# prefix commands still register while a Japanese IME is on.
switch_ascii_input_source_in_prefix = true
# Keep the IME candidate window tracking inside TUI agents that paint their own
# cursor. Trade-off: an extra cursor shows in apps that hide it without drawing
# a replacement.
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]
