# keyd counterpart of config/karabiner/karabiner.json, for omarchy. keyd reads
# only /etc/keyd, so scripts/link.sh copies this file there instead of linking.
#
# Written without keyd installed, so none of it has run. Check with `keyd check`
# first, then `sudo keyd monitor` to see which keys each device sends.

[ids]
*
# The Touch Bar presents itself as a keyboard; leave it to tiny-dfr.
-05ac:8302

[main]
# Karabiner's global caps_lock -> left_control is not here: ctrl:nocaps in
# ~/.config/hypr/input.lua does it.

# Karabiner's "tap a command key alone for eisuu/kana". Needs Muhenkan and
# Henkan bound to deactivate/activate in fcitx5's Hotkey settings.
leftmeta = overload(meta, muhenkan)
rightmeta = overload(rightnav, henkan)

# Right command + hjkl -> arrows, with the command key dropped as Karabiner does.
# The layer keeps meta for every other key so Hyprland's Super_R chords still
# work. clearm() is the part to confirm against `man keyd`.
[rightnav:M]
h = clearm(left)
j = clearm(down)
k = clearm(up)
l = clearm(right)

# Karabiner's fn layer (HHKB arrow, media and F13-F15 modes). Nothing activates
# it yet: Karabiner reaches it by remapping right_shift to fn on Apple device
# 05ac:0277 and 05ac:027b, and whether fn is visible to keyd on the T2 keyboard
# is still unchecked. Once `keyd monitor` shows a key to use, add under a
# per-device [ids] block, e.g. `rightshift = layer(hhkb)`.
[hhkb]
semicolon = left
slash = down
leftbrace = up
apostrophe = right
l = pageup
dot = pagedown
k = home
comma = end
a = volumedown
s = volumeup
d = mute
i = f13
o = f14
p = f15
