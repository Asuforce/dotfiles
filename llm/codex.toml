# Defaults added only where this machine has no setting yet.
model_reasoning_effort = "medium"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
project_doc_fallback_filenames = ["CLAUDE.md"]

# graphify dispatches its extraction to parallel subagents.
[features]
multi_agent = true

[sandbox_workspace_write]
network_access = true

[tui]
notifications = true
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-remaining", "five-hour-limit", "weekly-limit"]
